name: Internal release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          mkdir -p release
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > release/airpods-companion-upload.jks
          {
            echo "storeFile=release/airpods-companion-upload.jks"
            echo "storePassword=$UPLOAD_STORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > keystore.properties
      - name: Validate and build
        run: ./gradlew test lintRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: airpods-companion-internal-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
